[project]
name = "kunde"
version = "0.1.0"
description = "REST-Appserver für Kunden mit FastAPI, SQLAlchemy und PostgreSQL"
authors = [
    { name = "Umut Ulaş Cin", email = "umutcin33@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
kunde = "kunde:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Konflikt mit dem Formatter
    "CPY001", # kein Copyright-Header je Datei
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
